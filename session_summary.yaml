    - date: Year1_Day_1
      event: 源雅通與淵談判，以主從契約完成式神約束，淵釋放所有被吸納的人之輪廓，包含村長之子、德市之妻及數名更早的死者。
      world_impact: local
    - date: Year1_Day_1
      event: 德市之女小梅自異常深眠中甦醒，恢復意識。
